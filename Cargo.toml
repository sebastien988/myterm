[package]
name = "myterm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A native Windows terminal emulator with tabs, built on egui and alacritty_terminal"
readme = "README.md"
license = "MIT"
repository = "https://github.com/sebastien988/myterm"
keywords = ["terminal", "terminal-emulator", "conpty", "egui", "tabs"]
categories = ["command-line-utilities"]
publish = false
build = "build.rs"

[[bin]]
name = "myterm"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_term = "0.1"
alacritty_terminal = "0.25"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
