[package]
name = "myterm"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "myterm"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_term = "0.1"
alacritty_terminal = "0.25"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
